<body class="font-body-md overflow-hidden">
<!-- Navigation Drawer -->
<aside class="fixed left-0 top-0 h-full w-[210px] z-[60] bg-[#121826] border-r border-[#1f2937] flex flex-col h-full py-4">
<div class="text-white font-bold px-4 py-6 border-b border-[#1f2937] font-h2">
            SYSTEM CONTROL
</div>

<nav class="mt-6 flex-1">
  <div class="bg-blue-500/10 text-blue-500 border-l-4 border-blue-500 flex items-center gap-3 px-4 py-3 cursor-pointer font-inter text-[13px] font-medium tracking-wide">
    <span class="material-symbols-outlined">database</span>
    ANPR Feed
  </div>
  <a href="/camera-management"
    class="text-slate-400 flex items-center gap-3 px-4 py-3 hover:text-slate-200 cursor-pointer text-[13px] font-medium tracking-wide">
    <span class="material-symbols-outlined">linked_camera</span>Camera Management
  </a>
  <div onclick="live()" class="text-slate-400 flex items-center gap-3 px-4 py-3 hover:text-slate-200 cursor-pointer text-[13px] font-medium tracking-wide">

    Live View
  </div>
</nav>

<div class="mt-auto border-t border-[#1f2937] pt-4">
<div onclick="logout()" class="text-slate-400 flex items-center gap-3 px-4 py-3 hover:text-slate-200 transition-all cursor-pointer font-inter text-[13px] font-medium tracking-wide">
<span class="material-symbols-outlined">logout</span>
                Logout
            </div>
</div>
</aside>
<!-- Top App Bar -->
<header class="fixed top-0 w-full h-16 z-50 bg-[#0a0e14] border-b border-[#1f2937] flex items-center justify-between px-6 w-full ml-[240px] max-w-[calc(100%-240px)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-blue-500">security</span>
<span class="text-blue-500 font-black tracking-tighter text-xl">i-PHALAKAM&nbsp;&nbsp;&nbsp;DASHBOARD</span>
</div>
<div class="header">
    <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">
</div>
</header>
<div id="imgModal" 
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
     background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:9999;">

    <img id="modalImg" style="max-width:90%; max-height:90%;">

</div>
<!-- Main Content Canvas -->
<main class="ml-[240px] pt-20 h-screen overflow-y-auto bg-background p-8 space-y-6">
<!-- Search & Filter Bar -->

<section class="bg-[#0f172a] border border-[#1f2937] p-5 mb-6 rounded-xl shadow-lg">

<div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">

<!-- Plate -->
<div>
<label class="text-xs text-gray-400 mb-1 block">REGISTRATION NUMBER</label>
<input id="plateInput" class="w-full bg-[#020617] border border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
placeholder="Enter regist..." />
</div>

<!-- Lane -->
<div>
<label class="text-xs text-gray-400 mb-1 block">LANE</label>

<input id="laneInput"
class="w-full bg-[#020617] border border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
placeholder="Enter lane..." />

</div>

<!-- Camera -->
<div>
<label class="text-xs text-gray-400 mb-1 block">CAMERA</label>
<select id="cameraSelect" class="w-full bg-[#020617] border border-gray-700 rounded-lg px-3 py-2">
<option value="">All Cameras</option>{% for s in streams %} <option value="{{s}}">{{s}}</option>{% endfor %}
</select>
</div>

<!-- From -->
<div>
<label class="text-xs text-gray-400 mb-1 block">FROM</label>
<input id="fromTime" class="w-full bg-[#020617] border border-gray-700 rounded-lg px-3 py-2"/>
</div>

<!-- To -->
<div>
<label class="text-xs text-gray-400 mb-1 block">TO</label>
<input id="toTime" class="w-full bg-[#020617] border border-gray-700 rounded-lg px-3 py-2"/>
</div>

<!-- Buttons -->
<div class="flex gap-2">
<button onclick="loadFiltered()" class="flex-1 bg-blue-600 hover:bg-blue-700 py-2 rounded-lg font-semibold">Apply</button>

<button onclick="resetFilters()" class="w-12 bg-gray-800 hover:bg-gray-700 rounded-lg flex items-center justify-center">
⟳
</button>
</div>

</div>
</section>
<!-- Real-time Feed Table -->
<div class="bg-surface-container-low border border-[#1f2937] rounded-lg overflow-hidden shadow-sm">
<div class="px-6 py-4 border-b border-[#1f2937] flex items-center justify-between">
<h2 class="font-h2 text-white flex items-center gap-2">
<span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> Live Detections</h2>

</div>


<div class="overflow-x-auto">
  <table class="w-full text-center border-collapse">
    
    <thead class="bg-[#020617] sticky top-0">
      <tr>
        <th class="px-6 py-3 text-left">TIMESTAMP</th>
        <th class="px-6 py-3 font-bold border-b border-[#1f2937]">CAMERA SCN</th>
        <th class="px-6 py-3 font-bold border-b border-[#1f2937]">LANE</th>
        <th class="px-6 py-3 font-bold border-b border-[#1f2937]">VEHICLE IMAGE</th>
        <th class="px-6 py-3 font-bold border-b border-[#1f2937]">NO PLATE IMAGE</th>
        <th class="px-6 py-3 font-bold border-b border-[#1f2937]">REGISTRATION NO</th>
      </tr>
    </thead>

    <tbody id="tableBody" class="divide-y divide-[#1f2937] text-center align-middle"></tbody>

  </table>
</div>

<div class="flex items-center justify-between px-4 py-3 text-sm text-gray-400">

<div>Show <select id="pageSize" onchange="changePageSize()"
class="bg-[#020617] border border-gray-700 rounded px-5 py-1 ml-2">
<option value="10">10</option>
<option value="20">20</option>
<option value="50">50</option>
<option value="100">100</option>
</select>
</div>

<div class="flex items-center gap-3">
<button onclick="prevPage()" class="px-3 py-1 bg-gray-800 rounded hover:bg-gray-700">Prev</button>
<span id="pageInfo"></span>
<button onclick="nextPage()" class="px-3 py-1 bg-gray-800 rounded hover:bg-gray-700">Next</button>
</div>

</div>

</div>
</main>

<div id="imgModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:9999;">
<img id="modalImg" style="max-width:90%; max-height:90%; border-radius:10px;">
</div>

<script>
flatpickr("#fromTime", {
    enableTime: true,
    dateFormat: "Y-m-d H:i:S",
    time_24hr: true
});

flatpickr("#toTime", {
    enableTime: true,
    dateFormat: "Y-m-d H:i:S",
    time_24hr: true
});

let allData = [];
let currentPage = 1;
let pageSize = 10;
let isFiltered = false;
let debounceTimer;

function buildUrl() {

    let stream = document.getElementById("cameraSelect").value;
    let plate = document.getElementById("plateInput").value.trim();
    let lane = document.getElementById("laneInput").value.trim();

    let from = document.getElementById("fromTime").value;
    let to = document.getElementById("toTime").value;

    let url = `http://{{ ip }}:8070/api/data?`;

    let params = [];

    if (stream) {
        params.push(`stream_id=${encodeURIComponent(stream)}`);
    }

    if (plate) {
        params.push(`plate_no=${encodeURIComponent(plate)}`);
    }

    if (lane) {
        params.push(`lane=${encodeURIComponent(lane)}`);
    }

    if (from && to) {
        params.push(`from_time=${encodeURIComponent(from)}`);
        params.push(`to_time=${encodeURIComponent(to)}`);
    }

    return url + params.join("&");
}
// Load data

async function loadData() {

    const res = await fetch(buildUrl());

    const data = await res.json();

    allData = data;

    //currentPage = 1;

    renderTable();
}

function formatDate(dateString) {
    let date = new Date(dateString);

    let day = String(date.getDate()).padStart(2, '0');
    let month = String(date.getMonth() + 1).padStart(2, '0');
    let year = String(date.getFullYear()).slice(-4);

    let hours = String(date.getHours()).padStart(2, '0');
    let minutes = String(date.getMinutes()).padStart(2, '0');
    let seconds = String(date.getSeconds()).padStart(2, '0');
    let miliseconds = String(date.getMilliseconds()).padStart(2, '0');

    return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
}

function renderTable() {

    const tbody = document.getElementById("tableBody");

    tbody.innerHTML = "";

    const start = (currentPage - 1) * pageSize;

    const end = start + pageSize;

    const pageData = allData.slice(start, end);

    pageData.forEach(d => {

        const row = `
        <tr class="border-b border-[#1f2937]">

            <td class="px-4 py-3">${formatDate(d.timestamp)}</td>

            <td class="px-4 py-3">${d.scn}</td>

            <td class="px-4 py-3">${d.lane || "-"}</td>

            <td class="px-4 py-3">${d.vehicle_image ? `<button class="text-blue-400 hover:underline"
                onclick="showImg('${d.vehicle_image}')">View</button>` : "No Image"}</td>

            <td class="px-4 py-3"> ${d.plate_image ? `<button class="text-blue-400 hover:underline"
                onclick="showImg('${d.plate_image}')">View</button>` : "No Image"}</td>

            <td class="px-4 py-3">${d.plate_no || "N/A"}</td>

        </tr>
        `;

        tbody.innerHTML += row;
    });

    document.getElementById("pageInfo").innerText =
        `Page ${currentPage} of ${Math.max(1, Math.ceil(allData.length / pageSize))}`;
}

function nextPage() {

    if (currentPage * pageSize < allData.length) {
        currentPage++;
        renderTable();
    }
}

function prevPage() {

    if (currentPage > 1) {
        currentPage--;
        renderTable();
    }
}

function changePageSize() {

    pageSize = parseInt(document.getElementById("pageSize").value);

    currentPage = 1;

    renderTable();
}

function loadFiltered() {

    currentPage = 1;

    isFiltered = true;

    loadData();
}
// Filter

function resetFilters() {

    currentPage = 1;

    document.getElementById("plateInput").value = "";

    document.getElementById("laneInput").value = "";

    document.getElementById("cameraSelect").value = "";

    document.getElementById("fromTime").value = "";

    document.getElementById("toTime").value = "";

    isFiltered = false;

    loadData();
}

function showImg(path) {

    const modal = document.getElementById("imgModal");

    const img = document.getElementById("modalImg");

    img.src = `http://{{ ip }}:8070${path}`;

    modal.style.display = "flex";
}

// click anywhere to close
document.getElementById("imgModal").onclick = function () {

    this.style.display = "none";
};

function closeImg() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("plateInput").addEventListener("input", () => {

    clearTimeout(debounceTimer);

    debounceTimer = setTimeout(() => {

        currentPage = 1;

        loadData();

    }, 500);
});

document.getElementById("laneInput").addEventListener("input", () => {

    clearTimeout(debounceTimer);

    debounceTimer = setTimeout(() => {

        currentPage = 1;

        loadData();

    }, 500);
});
document.getElementById("cameraSelect").addEventListener("change", () => {

    currentPage = 1;

    loadData();
});

// Auto refresh
setInterval(() => {

    if (!isFiltered) {
        loadData();
    }

}, 3000);

// Initial load
loadData();

function live() {

    window.location.href = "/view1";
}

function logout() {
    window.location.href = "/logout";
}

</script>

</body></html>
