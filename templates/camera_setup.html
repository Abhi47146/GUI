<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Camera Setup - {{ scn }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='logo.jpg') }}" />
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>

    <style>
        body { background-color: #051424; color: #d4e4fa; min-height: 100vh; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="p-6">
    <!-- Header Bar -->
    <div class="w-full bg-[#122131] border border-[#1f2937] text-white flex items-center justify-between px-6 py-3 rounded-lg mb-6">
        <a href="/camera-management" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-2 rounded flex items-center gap-1">
            &larr; Go back
        </a>
        <h1 class="text-2xl font-bold tracking-wider">CAMERA SETUP: {{ scn }}</h1>
        <div></div>
    </div>

    <div class="grid grid-cols-12 gap-6">
        <!-- Zone Coordinates Panel -->
        <div class="col-span-5 bg-[#122131] border border-[#1f2937] p-6 rounded-lg flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-white mb-4">Zone Coordinates</h2>
                
                <div id="zonesContainer" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    {% if zones %}
                        {% for z_key, z_val in zones.items() %}
                        <div class="zone-block bg-[#051424] p-3 border border-[#1f2937] rounded space-y-2" data-zone-key="{{ z_key }}">
                            <div class="flex justify-between items-center text-xs font-semibold text-blue-400">
                                <span class="zone-label">{{ z_key.upper() }}</span>
                                <button type="button" onclick="removeZoneBlock(this)" class="text-red-400 hover:text-red-300">Delete Zone</button>
                            </div>
                            <input type="text" oninput="redrawCanvas()" class="zone-coords-input w-full bg-[#122131] border border-[#1f2937] text-white text-xs p-2 rounded" value="{{ z_val }}">
                        </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-[#1f2937] flex justify-end">
                <button type="button" onclick="saveAllZones()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-6 py-2 rounded font-bold">
                    Submit Config
                </button>
            </div>
        </div>

        <!-- Video Stream & Canvas Panel -->
        <div class="col-span-7 bg-[#122131] border border-[#1f2937] p-6 rounded-lg flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-4">
                <span class="text-sm font-semibold text-green-400 flex items-center gap-1">
                    <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Direct Stream
                </span>
                <div class="flex gap-2">
                    <button type="button" onclick="setDrawMode()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded">Draw Polygon</button>
                    <!-- Clear All Button -->
                    <button type="button" onclick="clearAllZones()" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded">Clear All</button>
                </div>
            </div>

            <!-- Dynamic Container with Max Constraints -->
            <div class="relative border border-slate-700 rounded overflow-hidden max-w-full flex justify-center items-center">
                <img id="streamFeed" src="{{ url_for('direct_video_feed', scn=scn) }}" class="hidden" crossorigin="anonymous">
                <canvas id="canvas" class="bg-slate-900 cursor-crosshair relative z-10 max-w-full h-auto block"></canvas>
            </div>
        </div>
    </div>

    <script>
    const scn = "{{ scn }}";
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = document.getElementById('streamFeed');

    // Canvas internal pixel dimensions from Flask config
    let configWidth = parseInt("{{ frame_width }}", 10);
    let configHeight = parseInt("{{ frame_height }}", 10);

    canvas.width = configWidth;
    canvas.height = configHeight;

    let currentPoints = [];
    let isDrawing = false;
    let maxZoneNum = 0;

    let hoveredZoneKey = null; // Track currently hovered zone ID

    // Dragging state tracking
    let draggingPointInfo = null; 
    const POINT_RADIUS = 6; 

    function initializeMaxZoneNum() {
        $('#zonesContainer .zone-block').each(function() {
            const key = $(this).attr('data-zone-key') || '';
            const match = key.match(/\d+$/);
            if (match) {
                const num = parseInt(match[0], 10);
                if (num > maxZoneNum) maxZoneNum = num;
            }
        });
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: Math.round((e.clientX - rect.left) * scaleX),
            y: Math.round((e.clientY - rect.top) * scaleY)
        };
    }

    function isNearPoint(p1, p2, threshold = 10) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y) <= threshold;
    }

    // Ray-Casting algorithm to check if point is inside polygon
    function isPointInPolygon(point, vs) {
        let x = point.x, y = point.y;
        let inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
            let xi = vs[i].x, yi = vs[i].y;
            let xj = vs[j].x, yj = vs[j].y;
            let intersect = ((yi > y) !== (yj > y)) &&
                (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    // Continuous rendering loop
    function renderLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw video frame if available
        if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }

        // Draw saved zone overlays
        $('#zonesContainer .zone-block').each(function() {
            const zoneKey = $(this).attr('data-zone-key');
            const inputVal = $(this).find('.zone-coords-input').val().trim();
            if (inputVal) {
                const coords = inputVal.split(',').map(n => parseFloat(n.trim()));
                if (coords.length === 8 && !coords.some(isNaN)) {
                    const isHovered = (hoveredZoneKey === zoneKey);
                    
                    // Use brighter colors if hovered
                    const fillColor = isHovered ? 'rgba(59, 130, 246, 0.65)' : 'rgba(59, 130, 246, 0.35)';
                    const strokeColor = isHovered ? '#60a5fa' : '#3b82f6';
                    
                    drawPolygon([
                        {x: coords[0], y: coords[1]},
                        {x: coords[2], y: coords[3]},
                        {x: coords[4], y: coords[5]},
                        {x: coords[6], y: coords[7]}
                    ], fillColor, strokeColor, isHovered);
                }
            }
        });

        // Draw current active drawing polygon
        if (currentPoints.length > 0) {
            drawPolygon(currentPoints, 'rgba(239, 68, 68, 0.4)', '#ef4444', true);
        }

        requestAnimationFrame(renderLoop);
    }

    function drawPolygon(pts, fillColor, strokeColor, isHovered = false) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(pts[i].x, pts[i].y);
        }
        if (pts.length === 4) {
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
        }
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = isHovered ? 3 : 2;
        ctx.stroke();

        // Draw point handles
        pts.forEach((p) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, isHovered ? POINT_RADIUS + 2 : POINT_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = strokeColor;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        });
    }

    canvas.addEventListener('mousedown', function(e) {
        const mouse = getCanvasCoords(e);

        for (let i = 0; i < currentPoints.length; i++) {
            if (isNearPoint(mouse, currentPoints[i])) {
                draggingPointInfo = { type: 'active', pointIndex: i };
                return;
            }
        }

        let foundExisting = false;
        $('#zonesContainer .zone-block').each(function() {
            if (foundExisting) return;
            const block = this;
            const inputVal = $(block).find('.zone-coords-input').val().trim();
            if (!inputVal) return;

            const coords = inputVal.split(',').map(n => parseFloat(n.trim()));
            if (coords.length === 8 && !coords.some(isNaN)) {
                const pts = [
                    {x: coords[0], y: coords[1]},
                    {x: coords[2], y: coords[3]},
                    {x: coords[4], y: coords[5]},
                    {x: coords[6], y: coords[7]}
                ];

                for (let i = 0; i < pts.length; i++) {
                    if (isNearPoint(mouse, pts[i])) {
                        draggingPointInfo = {
                            type: 'existing',
                            pointIndex: i,
                            zoneBlock: block,
                            points: pts
                        };
                        foundExisting = true;
                        return;
                    }
                }
            }
        });

        if (foundExisting) return;

        if (isDrawing && currentPoints.length < 4) {
            currentPoints.push({ x: mouse.x, y: mouse.y });

            if (currentPoints.length === 4) {
                isDrawing = false;
                appendZoneFromPoints(currentPoints);
                currentPoints = [];
            }
        }
    });

    canvas.addEventListener('mousemove', function(e) {
        const mouse = getCanvasCoords(e);

        if (draggingPointInfo) {
            if (draggingPointInfo.type === 'active') {
                currentPoints[draggingPointInfo.pointIndex] = { x: mouse.x, y: mouse.y };
            } else if (draggingPointInfo.type === 'existing') {
                draggingPointInfo.points[draggingPointInfo.pointIndex] = { x: mouse.x, y: mouse.y };
                const updatedStr = draggingPointInfo.points.map(p => `${p.x}, ${p.y}`).join(', ');
                $(draggingPointInfo.zoneBlock).find('.zone-coords-input').val(updatedStr);
            }
            return;
        }

        let isHoveringPoint = false;
        let newlyHoveredZoneKey = null;

        // Check if mouse is hovering over any polygon or corner point
        $('#zonesContainer .zone-block').each(function() {
            const zoneKey = $(this).attr('data-zone-key');
            const rawVal = $(this).find('.zone-coords-input').val().trim();
            if (rawVal) {
                const coords = rawVal.split(',').map(n => parseFloat(n.trim()));
                if (coords.length === 8 && !coords.some(isNaN)) {
                    const pts = [
                        {x: coords[0], y: coords[1]}, {x: coords[2], y: coords[3]},
                        {x: coords[4], y: coords[5]}, {x: coords[6], y: coords[7]}
                    ];
                    
                    for (let p of pts) {
                        if (isNearPoint(mouse, p)) {
                            isHoveringPoint = true;
                            newlyHoveredZoneKey = zoneKey;
                            break;
                        }
                    }

                    if (!newlyHoveredZoneKey && isPointInPolygon(mouse, pts)) {
                        newlyHoveredZoneKey = zoneKey;
                    }
                }
            }
        });

        // Toggle hover highlights on left-side list items
        if (hoveredZoneKey !== newlyHoveredZoneKey) {
            hoveredZoneKey = newlyHoveredZoneKey;
            
            // Clear current highlights
            $('#zonesContainer .zone-block').removeClass('ring-2 ring-blue-500 bg-[#172a3f]');

            // Apply blue outline to matching left sidebar element
            if (hoveredZoneKey) {
                $(`#zonesContainer .zone-block[data-zone-key="${hoveredZoneKey}"]`)
                    .addClass('ring-2 ring-blue-500 bg-[#172a3f]');
            }
        }

        canvas.style.cursor = isHoveringPoint ? 'move' : (isDrawing ? 'crosshair' : (hoveredZoneKey ? 'pointer' : 'default'));
    });

    // Add mouseenter/mouseleave bindings on zone blocks for two-way highlighting
    $(document).on('mouseenter', '.zone-block', function() {
        hoveredZoneKey = $(this).attr('data-zone-key');$(this).addClass('ring-2 ring-blue-500 bg-[#172a3f]');
    }).on('mouseleave', '.zone-block', function() {
        hoveredZoneKey = null;
        $(this).removeClass('ring-2 ring-blue-500 bg-[#172a3f]');
    });

    window.addEventListener('mouseup', function() {
        draggingPointInfo = null;
    });

    function setDrawMode() {
        currentPoints = [];
        isDrawing = true;
        canvas.style.cursor = 'crosshair';
    }

    function appendZoneFromPoints(pts) {
        const coordStr = pts.map(p => `${p.x}, ${p.y}`).join(', ');
        maxZoneNum += 1;
        const zoneKey = `zone_dimensions_${maxZoneNum}`;
        
        const html = `
            <div class="zone-block bg-[#051424] p-3 border border-[#1f2937] rounded space-y-2 transition-all duration-150" data-zone-key="${zoneKey}">
                <div class="flex justify-between items-center text-xs font-semibold text-blue-400">
                    <span class="zone-label">${zoneKey.toUpperCase()}</span>
                    <button type="button" onclick="removeZoneBlock(this)" class="text-red-400 hover:text-red-300">Delete Zone</button>
                </div>
                <input type="text" oninput="redrawCanvas()" class="zone-coords-input w-full bg-[#122131] border border-[#1f2937] text-white text-xs p-2 rounded" value="${coordStr}">
            </div>`;
        $('#zonesContainer').append(html);
    }

    function redrawCanvas() {}

    function removeZoneBlock(btn) {
        $(btn).closest('.zone-block').remove();
    }

    function clearAllZones() {
        if (confirm("Are you sure you want to clear all zones?")) {
            $('#zonesContainer').empty();
            currentPoints = [];
            isDrawing = false;
            maxZoneNum = 0;
        }
    }

    function saveAllZones() {
        const zones = {};
        $('#zonesContainer .zone-block').each(function() {
            const key = $(this).attr('data-zone-key');
            const val = $(this).find('.zone-coords-input').val();
            if (key) {
                zones[key] = val;
            }
        });

        fetch('/save_zones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ scn: scn, zones: zones })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                alert('Configuration successfully saved to config.ini!');
            } else {
                alert('Error saving configuration.');
            }
        });
    }

    $(document).ready(function() {
        initializeMaxZoneNum();
        renderLoop();
    });
</script>
</body>
</html>
