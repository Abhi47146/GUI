<!DOCTYPE html>
<html>
<head>
    <title>Authentication</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Background Image */
            background: linear-gradient(rgba(134, 133, 133, 0.7), rgba(129, 128, 128, 0.7)),
                        url("{{ url_for('static', filename='i-phalakam.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Glass Card */
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            width: 380px;
            padding: 35px;
            border-radius: 20px;

            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);

            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 14px;

            background: rgba(255,255,255,0.2);
            color: white;
        }

        input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .toggle {
            text-align: center;
            margin-top: 18px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .success {
            text-align: center;
            color: #51cf66;
            margin-bottom: 10px;
        }

        /* Logo Top Left */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">

<div class="card">

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if message %}
        <div class="success">{{ message }}</div>
    {% endif %}

    <h2 id="form-title">Login</h2>

    <!-- LOGIN FORM -->
    <form id="login-form" method="POST">
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" method="POST" action="/signup" style="display:none;">
        <input type="email" name="email" placeholder="Enter Email" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Sign Up</button>
    </form>

    <div class="toggle" onclick="toggleForm()">
        Don't have an account? Sign Up
    </div>

</div>

<script>
function toggleForm() {
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const title = document.getElementById("form-title");
    const toggleText = document.querySelector(".toggle");

    if (loginForm.style.display === "none") {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
        title.innerText = "Login";
        toggleText.innerText = "Don't have an account? Sign Up";
    } else {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        title.innerText = "Sign Up";
        toggleText.innerText = "Already have an account? Login";
    }
}
</script>

</body>
</html>
